name: "Godot Android Export"

on:
  push:
    branches:
      - main
      - master

jobs:
  export:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          if [ -f "Roblox2_Online_v1_2.zip" ]; then
            unzip -o Roblox2_Online_v1_2.zip
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download & Extract Godot + Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Generate Debug Keystore & Configure Godot
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.godot
          [godot]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_user = "androiddebugkey"
          export/android/debug_password = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Generate export_presets.cfg
        run: |
          PROJ_DIR=$(find . -name "project.godot" -exec dirname {} \;)
          cat <<EOF > "$PROJ_DIR/export_presets.cfg"
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server_id=""
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/android/Roblox2_Online.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/release=""
          custom_template/debug=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.roblox2"
          package/name="Roblox2 Online"
          package/signed=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Export APK
        run: |
          mkdir -v -p build/android
          PROJ_DIR=$(find . -name "project.godot" -exec dirname {} \;)
          cd "$PROJ_DIR"
          godot --headless --export-release "Android" ../build/android/Roblox2_Online.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/android/Roblox2_Online.apk
