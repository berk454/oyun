name: Godot Android Export

on:
  push:
    branches:
      - main
      - master

jobs:
  export:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o Roblox2_Online_v1_2.zip -d extracted

      - name: Find Godot Project
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted -type f -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "HATA: project.godot bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJE: $PROJECT_DIR"

          mkdir -p godot_project
          cp -a "$PROJECT_DIR"/. godot_project/

          echo "project.godot:"
          ls -l godot_project/project.godot

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Create Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -keyalg RSA \
            -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip

          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip

          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Download Android Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"

          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz \
            -O templates.tpz

          unzip -q templates.tpz -d templates

          cp -r templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.2.2.stable/" || true

      - name: Configure Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_user = "androiddebugkey"
          export/android/debug_password = "android"
          EOF

      - name: Create Export Preset
        working-directory: godot_project
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server_id=""
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Roblox2_Online.apk"

          [preset.0.options]

          custom_template/release=""
          custom_template/debug=""
          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.example.roblox2"
          package/name="Roblox2 Online"

          package/signed=false

          version/code=1
          version/name="1.0"
          EOF

      - name: Import Project
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 \
            --headless \
            --path godot_project \
            --editor \
            --quit

      - name: Export APK
        run: |
          mkdir -p godot_project/build

          ./Godot_v4.2.2-stable_linux.x86_64 \
            --headless \
            --path godot_project \
            --export-debug "Android" \
            godot_project/build/Roblox2_Online.apk

      - name: Check APK
        run: |
          ls -lh godot_project/build/

          if [ ! -f godot_project/build/Roblox2_Online.apk ]; then
            echo "APK OLUŞMADI!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roblox2-Android-APK
          path: godot_project/build/Roblox2_Online.apk
