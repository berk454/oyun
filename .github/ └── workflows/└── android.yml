```yaml
name: Godot Android Export

on:
  push:
    branches:
      - main
      - master

jobs:
  export:
    name: Android Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          if [ -f "Roblox2_Online_v1_2.zip" ]; then
            mkdir -p extracted
            unzip -o "Roblox2_Online_v1_2.zip" -d extracted
          else
            echo "ZIP bulunamadı!"
            exit 1
          fi

      - name: Find Godot Project
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted -type f -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot projesi bulundu:"
          echo "$PROJECT_DIR"

          mkdir -p godot_project

          cp -a "$PROJECT_DIR"/. godot_project/

          echo "Proje dosyaları:"
          ls -la godot_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Export Preset
        working-directory: godot_project
        shell: bash
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server_id=""
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Roblox2_Online.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/release=""
          custom_template/debug=""
          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.example.roblox2"
          package/name="Roblox2 Online"

          package/signed=false

          keystore/debug=""
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          version/code=1
          version/name="1.0"
          EOF

      - name: Export Android APK
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./godot_project
          archive_output: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roblox2-Android-APK
          path: godot_project/build/
          if-no-files-found: error
```
